# THERMORA Frontend Docker Compose Service Snippet
# Merge into your main docker-compose.yml or run alongside backend:
# docker compose -f docker-compose.yml -f docker-compose.frontend.yml up -d

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_USE_MOCK: "false"
        VITE_API_BASE_URL: "/api/v1"
    container_name: thermora-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - thermora-net
    restart: unless-stopped

networks:
  thermora-net:
    name: thermora-net
    driver: bridge
